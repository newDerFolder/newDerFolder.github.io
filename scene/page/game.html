<!DOCTYPE html>
<html lang="zh-CN">
<head>

    <!-- 引用 Pico.css 做基础样式 -->

    <!-- 引入游戏卡片组件（样式也在里面） -->
    <script src="/js/GameCard.js"></script>
</head>
<body>
    <main class="container">
        <nav>
            <ul>
                <li><a href="/index.html" role="button" class="outline">🏠 返回首页</a></li>

        </nav>

        <h1>🎮 我的游戏作品</h1>
        <p>以下是我用 Godot 引擎开发的一些小游戏，点击下载即可体验。</p>

        <!-- 使用封装好的 game-card 组件 -->
        <game-card 
            title="太空冒险" 
            desc="驾驶飞船穿越小行星带，收集能量水晶，躲避陨石撞击。"

            emoji="🚀"
            version="v1.2">
        </game-card>

        <game-card 
            title="糖果消除" 
            desc="经典的消除玩法，搭配甜蜜的视觉风格，适合所有年龄段。"
            link="https://github.com/你的用户名/你的仓库名/releases/tag/v1.0"
            emoji="🍬"
            version="v1.0">
        </game-card>

        <game-card 
            title="跑酷大师" 
            desc="控制角色在无尽的赛道上奔跑跳跃，挑战你的极限反应。"
            link="https://github.com/你的用户名/你的仓库名/releases/tag/v1.0"
            emoji="🏃"
            version="v0.9">
        </game-card>

        <footer style="margin-top: 40px; text-align: center; color: #6c757d;">
            <small>所有游戏均使用 Godot 引擎开发 · 持续更新中</small>
        </footer>
    </main>
