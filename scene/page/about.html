<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>关于我</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@1/css/pico.min.css">
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            background: #eef2f7;
            color: #0f172a;
            font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }
        .page-wrap {
            position: relative;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px 20px;
            overflow: hidden;
        }
        .background-panel {
            position: absolute;
            left: 0;
            right: 0;
            top: 12vh;
            height: 58vh;
            background-image: url('/image/gamePan.png');
            background-size: cover;
            background-repeat: no-repeat;
            background-position: center center;
            opacity: 0.28;
            filter: saturate(0.95) brightness(0.92);
            pointer-events: none;
            transform: translateY(8%);
        }
        .background-overlay {
            position: absolute;
            inset: 0;
            background: linear-gradient(180deg, rgba(239,242,246,0.96) 0%, rgba(239,242,246,0.70) 45%, rgba(239,242,246,0.82) 100%);
            pointer-events: none;
        }
        .about-card {
            position: relative;
            width: 100%;
            max-width: 900px;
            background: rgba(255,255,255,0.72);
            border-radius: 32px;
            padding: 42px;
            box-shadow: 0 26px 70px rgba(15, 23, 42, 0.14);
            border: 1px solid rgba(255,255,255,0.70);
            backdrop-filter: blur(18px);
            z-index: 1;
        }
        .profile-top {
            display: grid;
            grid-template-columns: 180px 1fr;
            gap: 32px;
            align-items: center;
        }
        .avatar {
            width: 180px;
            height: 180px;
            border-radius: 28px;
            overflow: hidden;
            background: linear-gradient(135deg, #7c3aed 0%, #38bdf8 100%);
            box-shadow: 0 22px 40px rgba(15, 23, 42, 0.18);
        }
        .avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }
        .profile-meta {
            display: flex;
            flex-direction: column;
            gap: 18px;
        }
        .profile-meta .name-title {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .profile-meta .eyebrow {
            margin: 0;
            font-size: 0.95rem;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            color: #475569;
        }
        .profile-meta h1 {
            margin: 0;
            font-size: clamp(2.6rem, 4vw, 3.4rem);
            line-height: 1;
        }
        .profile-meta p.intro {
            margin: 0;
            color: #334155;
            font-size: 1rem;
            line-height: 1.8;
            max-width: 680px;
        }
        .tag-row {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 8px;
        }
        .tag {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 10px 16px;
            border-radius: 999px;
            background: rgba(59, 130, 246, 0.13);
            color: #1e293b;
            font-size: 0.95rem;
            border: 1px solid rgba(59, 130, 246, 0.18);
        }
        .summary-card {
            margin-top: 34px;
            border-radius: 28px;
            background: rgba(255, 255, 255, 0.78);
            padding: 26px 28px;
            border: 1px solid rgba(148, 163, 184, 0.18);
            box-shadow: 0 18px 35px rgba(15, 23, 42, 0.08);
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }
        .summary-item {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .summary-item strong {
            font-size: 1rem;
            color: #0f172a;
        }
        .summary-item span {
            color: #475569;
            line-height: 1.7;
            font-size: 0.98rem;
        }
        @media (max-width: 880px) {
            .profile-top {
                grid-template-columns: 1fr;
                text-align: center;
            }
            .profile-meta {
                align-items: center;
            }
            .tag-row {
                justify-content: center;
            }
            .summary-card {
                grid-template-columns: 1fr;
            }
        }
        @media (max-width: 640px) {
            .page-wrap {
                padding: 22px 16px;
            }
            .about-card {
                padding: 28px 22px;
                border-radius: 24px;
            }
            .avatar {
                width: 150px;
                height: 150px;
                margin: 0 auto;
            }
        }
    </style>
</head>
<body>
    <main class="page-wrap">
        <div class="background-panel"></div>
        <div class="background-overlay"></div>
        <section class="about-card">
            <div class="profile-top">
                <div class="avatar">
                    <img src="/image/自由生存者emoji2.png" alt="头像">
                </div>
                <div class="profile-meta">
                    <div class="name-title">
                        <p class="eyebrow">个人介绍</p>
                        <h1>我是 新建文件夹</h1>
                    </div>
                    <p class="intro">热爱游戏与工具制作，追求简洁又大气的视觉表达。这个页面通过透明浮层与底部大图，营造现代、好看的个人主页风格。</p>
                    <div class="tag-row">
                        <span class="tag">游戏制作</span>
                        <span class="tag">界面设计</span>
                        <span class="tag">轻量视觉</span>
                    </div>
                </div>
            </div>
            <div class="summary-card">
                <div class="summary-item">
                    <strong>我的定位</strong>
                    <span>将创意与可玩性结合，打造既有态度又易上手的游戏与工具。</span>
                </div>
                <div class="summary-item">
                    <strong>现在在做</strong>
                    <span>完善个人网站内容，展示作品、开发历程以及社区互动入口。</span>
                </div>
            </div>
        </section>
    </main>
</body>
</html>
