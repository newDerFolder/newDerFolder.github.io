<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>关于我</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@1/css/pico.min.css">
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            background: #f5f7fb;
            color: #121827;
            font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }
        .page-wrap {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 18px;
        }
        .about-card {
            width: 100%;
            max-width: 880px;
            background: #ffffff;
            border-radius: 32px;
            padding: 48px;
            box-shadow: 0 30px 80px rgba(15, 23, 42, 0.08);
            border: 1px solid rgba(15, 23, 42, 0.06);
        }
        .profile-top {
            display: grid;
            grid-template-columns: 150px 1fr;
            gap: 28px;
            align-items: center;
        }
        .avatar {
            width: 150px;
            height: 150px;
            border-radius: 28px;
            overflow: hidden;
            background: linear-gradient(135deg, #7c3aed 0%, #38bdf8 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 22px 40px rgba(15, 23, 42, 0.12);
        }
        .avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }
        .profile-title {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        .profile-title .eyebrow {
            font-size: 0.95rem;
            letter-spacing: 0.16em;
            text-transform: uppercase;
            color: #6b7280;
            margin: 0;
        }
        .profile-title h1 {
            margin: 0;
            font-size: clamp(2.8rem, 4vw, 3.5rem);
            line-height: 1.02;
        }
        .profile-title p.lead {
            margin: 0;
            max-width: 640px;
            color: #475569;
            font-size: 1.05rem;
            line-height: 1.85;
        }
        .badges {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-top: 10px;
        }
        .badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 12px 18px;
            border-radius: 999px;
            background: #f8fafc;
            color: #334155;
            font-size: 0.95rem;
            box-shadow: inset 0 0 0 1px rgba(15, 23, 42, 0.04);
        }
        .info-grid {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 20px;
            margin-top: 42px;
        }
        .info-block {
            background: #f8fafc;
            border-radius: 24px;
            padding: 28px;
            box-shadow: 0 18px 40px rgba(15, 23, 42, 0.05);
            border: 1px solid rgba(148, 163, 184, 0.16);
        }
        .info-block h3 {
            margin: 0 0 14px;
            font-size: 1.05rem;
            color: #111827;
        }
        .info-block p {
            margin: 0;
            color: #475569;
            line-height: 1.75;
        }
        .about-note {
            margin-top: 42px;
            padding: 24px 26px;
            border-radius: 24px;
            background: linear-gradient(135deg, rgba(59,130,246,0.08) 0%, rgba(148,163,184,0.12) 100%);
            border: 1px solid rgba(59,130,246,0.14);
            color: #1e293b;
            font-size: 1rem;
            line-height: 1.8;
        }
        @media (max-width: 840px) {
            .profile-top {
                grid-template-columns: 1fr;
                text-align: center;
            }
            .profile-top .profile-title {
                align-items: center;
            }
            .avatar {
                width: 180px;
                height: 180px;
                margin: 0 auto;
            }
        }
        @media (max-width: 640px) {
            .about-card {
                padding: 32px 20px;
                border-radius: 24px;
            }
            .info-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <main class="page-wrap">
        <section class="about-card">
            <div class="profile-top">
                <div class="avatar">
                    <img src="/image/自由生存者emoji2.png" alt="头像">
                </div>
                <div class="profile-title">
                    <p class="eyebrow">个人简介</p>
                    <h1>我是 新建文件夹</h1>
                    <p class="lead">热爱游戏与工具制作，希望用简洁大方的页面展示我的创作与成长。这里既是作品合集，也是我的个人档案，欢迎你了解我的故事。</p>
                    <div class="badges">
                        <span class="badge">游戏创作</span>
                        <span class="badge">工具开发</span>
                        <span class="badge">简约美学</span>
                    </div>
                </div>
            </div>
            <div class="info-grid">
                <div class="info-block">
                    <h3>我的方向</h3>
                    <p>将玩法与界面结合，让每一个作品既有趣又易上手；追求轻松的视觉表现和清晰的内容结构。</p>
                </div>
                <div class="info-block">
                    <h3>当前目标</h3>
                    <p>完成个人网站升级，持续发布游戏、软件和实用工具，记录每一次进步与新尝试。</p>
                </div>
                <div class="info-block">
                    <h3>我的风格</h3>
                    <p>喜欢浅色、柔和、自然的配色；页面以大块留白、圆角卡片和清晰标题为主，做出干净又大气的感觉。</p>
                </div>
            </div>
            <div class="about-note">
                这是一个专注于内容与视觉平衡的个人介绍页。没有复杂导航，重点放在头像、姓名、简介和核心信息上，让访客迅速感受你的风格。
            </div>
        </section>
    </main>
</body>
</html>
