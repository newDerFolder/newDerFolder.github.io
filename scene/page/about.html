<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>关于我</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@1/css/pico.min.css">
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            min-width: 100vw;
            overflow-x: hidden;
            background: #eef2f7;
            color: #0f172a;
            font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }
        .page-wrap {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: flex-end;
            padding: 30px 100px 30px 20px;
            overflow: hidden;
        }
        .background-panel {
            position: absolute;
            inset: 0;
            background-image: url('/image/ts背景图大.png');
            background-size: cover;
            background-repeat: no-repeat;
            background-position: center center;
            opacity: 1;
            filter: saturate(1.08) brightness(1);
            pointer-events: none;
            transform: none;
        }
        .background-overlay {
            position: absolute;
            inset: 0;
            background: rgba(255,255,255,0.00);
            pointer-events: none;
        }
        .about-card {
            position: relative;
            width: min(84%, 740px);
            max-width: 740px;
            background: rgba(255,255,255,0.005);
            border-radius: 28px;
            padding: 34px;
            box-shadow: 0 20px 48px rgba(15, 23, 42, 0.05), inset 0 0 0 1px rgba(255,255,255,0.06);
            border: 1px solid rgba(255,255,255,0.08);
            backdrop-filter: blur(48px);
            z-index: 1;
            overflow: hidden;
        }
        .about-card::before {
            content: '';
            position: absolute;
            inset: 0;
            pointer-events: none;
            border-radius: 28px;
            background: linear-gradient(135deg, rgba(255,255,255,0.22), rgba(255,255,255,0));
            mix-blend-mode: screen;
        }
        .profile-top {
            display: grid;
            grid-template-columns: 160px 1fr;
            gap: 28px;
            align-items: center;
            background: rgba(255, 255, 255, 0.002);
            padding: 26px;
            border-radius: 24px;
            border: 1px solid rgba(255,255,255,0.08);
            box-shadow: inset 0 0 0 1px rgba(255,255,255,0.02), 0 0 0 1px rgba(255,255,255,0.05);
            backdrop-filter: blur(36px);
        }
        .avatar {
            width: 160px;
            height: 160px;
            border-radius: 28px;
            overflow: hidden;
            background: rgba(255,255,255,0.005);
            box-shadow: 0 24px 40px rgba(15, 23, 42, 0.06);
            border: 1px solid rgba(255,255,255,0.92);
        }
        .home-link {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            margin-top: 28px;
            width: 100%;
            max-width: 320px;
            padding: 14px 24px;
            border-radius: 999px;
            background: rgba(255,255,255,0.18);
            color: #0f172a;
            border: 1px solid rgba(255,255,255,0.3);
            text-decoration: none;
            box-shadow: 0 12px 24px rgba(15, 23, 42, 0.08);
            backdrop-filter: blur(22px);
            transition: transform 0.2s ease, background 0.2s ease;
        }
        .home-link:hover {
            transform: translateY(-2px);
            background: rgba(255,255,255,0.26);
        }
        .avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }
        .profile-meta {
            display: flex;
            flex-direction: column;
            gap: 18px;
        }
        .profile-meta .name-title {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .profile-meta .eyebrow {
            margin: 0;
            font-size: 0.95rem;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            color: #334155;
        }
        .profile-meta h1 {
            margin: 0;
            font-size: clamp(2.6rem, 4vw, 3.4rem);
            line-height: 1;
            color: #0f172a;
        }
        .profile-meta p.intro {
            margin: 0;
            color: #1f2937;
            font-size: 1rem;
            line-height: 1.8;
            max-width: 680px;
        }
        .tag-row {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 8px;
        }
        .tag {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 10px 16px;
            border-radius: 999px;
            background: rgba(59, 130, 246, 0.13);
            color: #1e293b;
            font-size: 0.95rem;
            border: 1px solid rgba(59, 130, 246, 0.18);
        }
        .summary-card {
            margin-top: 34px;
            border-radius: 28px;
            background: rgba(255, 255, 255, 0.78);
            padding: 26px 28px;
            border: 1px solid rgba(148, 163, 184, 0.18);
            box-shadow: 0 18px 35px rgba(15, 23, 42, 0.08);
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }
        .summary-item {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .summary-item strong {
            font-size: 1rem;
            color: #0f172a;
        }
        .summary-item span {
            color: #475569;
            line-height: 1.7;
            font-size: 0.98rem;
        }
        @media (max-width: 880px) {
            .profile-top {
                grid-template-columns: 1fr;
                text-align: center;
            }
            .profile-meta {
                align-items: center;
            }
            .tag-row {
                justify-content: center;
            }
            .summary-card {
                grid-template-columns: 1fr;
            }
        }
        @media (max-width: 640px) {
            .page-wrap {
                padding: 22px 16px;
            }
            .about-card {
                padding: 28px 22px;
                border-radius: 24px;
            }
            .avatar {
                width: 150px;
                height: 150px;
                margin: 0 auto;
            }
        }
    </style>
</head>
<body>
    <main class="page-wrap">
        <div class="background-panel"></div>
        <div class="background-overlay"></div>
        <section class="about-card">
            <div class="profile-top">
                <div class="avatar">
                    <img src="/image/ts头像.jpg" alt="头像">
                </div>
                <div class="profile-meta">
                    <div class="name-title">
                        <h1>我是 新建文件夹</h1>
                    </div>
                    <p class="intro">热爱游戏与工具制作，追求简洁又大气的视觉表达。这个页面通过透明浮层与底部大图，营造现代、好看的个人主页风格。</p>
                    <div class="tag-row">
                        <span class="tag">游戏制作</span>
                        <span class="tag">界面设计</span>
                        <span class="tag">轻量视觉</span>
                    </div>
                    <a href="/scene/page/home.html" class="home-link">去首页看看</a>
                </div>
            </div>
        </section>
    </main>
</body>
</html>
