    <style>
        /* ===== 固定导航栏 ===== */
        /* ===== 固定导航栏 - 居中对齐 ===== */
nav {
    position: sticky;
    top: 0;
    background: rgba(255, 255, 255, 0.7);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid rgba(255,255,255,0.2);
    z-index: 999;
    padding: 10px 0;
}

nav ul {
    display: flex;
    justify-content: center;
    align-items: center;
    flex-wrap: wrap;
    gap: 8px 16px;
    margin: 0;
    padding: 0;
    padding-left: 50px; /* 新增：整体左内边距 50px */
    list-style: none;
}

nav ul li {
    margin: 0;
    padding: 0;
}

nav a {
    color: #1a1a2e !important;
}

/* 小屏适配 */
@media (max-width: 600px) {
    nav ul {
        gap: 4px 8px;
    }
    nav a {
        font-size: 0.85rem;
        padding: 4px 10px !important;
    }
}
        /* 大卡片横幅样式 */
        .hero-card {
            display: block;
            position: relative;
            margin: 30px 0;
            padding: 200px 40px;
            border-radius: 16px;
            background-image: url('/image/gamePan.png');
            background-size: cover;
            background-position: center;
            text-decoration: none;
            color: white;
            box-shadow: 0 4px 16px rgba(0,0,0,0.15);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            overflow: hidden;
        }
        .hero-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 32px rgba(0,0,0,0.25);
        }
        .hero-card .overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.45);
            border-radius: 16px;
            z-index: 1;
        }
        .hero-card .content {
            position: relative;
            z-index: 2;
            text-align: center;
        }
        .hero-card .content h2 {
            font-size: 2.8rem;
            margin-bottom: 12px;
            color: white;
            text-shadow: 0 2px 8px rgba(0,0,0,0.5);
        }
        .hero-card .content p {
            font-size: 1.2rem;
            margin-bottom: 20px;
            color: rgba(255,255,255,0.9);
            text-shadow: 0 1px 4px rgba(0,0,0,0.5);
        }
        .hero-card .content .btn {
            display: inline-block;
            background: #ffffff;
            color: #1a1a2e;
            padding: 12px 36px;
            border-radius: 30px;
            font-weight: 600;
            text-decoration: none;
            transition: background 0.2s ease;
        }
        .hero-card .content .btn:hover {
            background: #f0f0f0;
        }

        /* 小屏适配 */
        @media (max-width: 600px) {
            .hero-card {
                padding: 40px 20px;
            }
            .hero-card .content h2 {
                font-size: 2rem;
            }
            .hero-card .content p {
                font-size: 1rem;
            }
            nav {
                padding: 6px 0;
            }
        }
    </style>
</head>

<body>
